<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Umgidi RSVPs · Uyanda Calana</title>
  <meta name="theme-color" content="#FBF5EA">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="page-list">
  <div class="sheet">
    <div class="bead" role="presentation"></div>

    <header class="list-head">
      <p class="cry" lang="xh">NGUWO NGUWO NGUWO!!!!</p>
      <h1>UMGIDI</h1>
      <p class="host">ka Uyanda Calana</p>
    </header>

    <p class="loading block" id="loading">Opening the list…</p>

    <section class="private block" id="private" hidden>
      <div class="ornament" aria-hidden="true"><span></span></div>
      <h2>This list is private</h2>
      <p>The hosts share a private link with the people who keep the guest list.</p>
    </section>

    <section class="block" id="board" hidden>
      <div class="count-wrap">
        <p class="count-kicker">Guests</p>
        <p class="count" id="count">0</p>
        <p class="match-note" id="match-note"></p>
      </div>

      <label for="search">Search</label>
      <input id="search" type="search" placeholder="Search a name" autocomplete="off" enterkeyhint="search">

      <div class="tools">
        <button class="primary" type="button" id="refresh">Refresh</button>
        <button type="button" id="csv">Download CSV</button>
      </div>
      <p class="updated" id="updated"></p>
      <p class="banner" id="banner" role="alert" hidden></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">No.</th>
              <th scope="col">Name</th>
              <th scope="col">Surname</th>
              <th scope="col">Submitted</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="empty" id="empty" hidden></p>
    </section>

    <div class="foot">
      <div class="bead" role="presentation"></div>
    </div>
  </div>
  <script src="js/list.js?v=20261125-oneclick2"></script>
</body>
</html>
